<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Соберём твой план питания · NutriPlan</title>
<style>
  :root{
    --accent:#16A34A; --accent-d:#0E7A36; --soft:#E7F8EC; --muted:#6B7566;
    --ink:#20321F; --bg:#FBF8F1; --field:#FFFFFF; --line:#EEE7D8; --cta-ink:#FFFFFF;
  }
  /*THEMEHOOK*/
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  .shell{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:0 20px calc(20px + env(safe-area-inset-bottom))}

  /* top bar */
  /* Та же история, что с подвалом: заливка шапки стояла её фоном и обрывалась
     по кромкам .shell — на свечении был виден светлый прямоугольник с прямым
     левым краем и прямым низом. Уносим заливку в фиксированный ::before у
     верхней кромки окна: она во всю ширину и с растворяющимся низом, поэтому
     краёв не остаётся. Непрозрачна там, где стоят логотип и прогресс, дальше
     сходит на нет. */
  .top{position:sticky;top:0;z-index:10;padding:14px 0 10px}
  .top::before{content:'';position:fixed;left:0;right:0;top:0;height:120px;z-index:-1;
    pointer-events:none;background:linear-gradient(180deg,var(--bg) 0,var(--bg) 66%,transparent)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:2px 0 12px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .top .row{display:flex;align-items:center;gap:12px;height:34px}
  /* Шапку на intro/build/plan убираем ИЗ ПОТОКА, а не прячем: visibility:hidden
     сохраняла её место, и экран плана открывался с пустой полосой в 99px над
     заголовком — на мобильном это почти четверть первого экрана, съеденная
     ничем. */
  .top.hide{display:none}
  .back{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--field);
    color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.15s}
  .back:hover{border-color:var(--accent)}
  .back[hidden]{display:none}
  .track{flex:1;height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.2,.7,.2,1)}
  .count{font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto;min-width:34px;text-align:right}

  main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:8px}
  .step{animation:in .38s cubic-bezier(.2,.7,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

  /* mascot guide (question in a speech bubble) */
  .guide{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .guide .m{width:70px;height:70px;flex:0 0 auto;border-radius:18px;overflow:hidden;background:var(--soft)}
  .guide .m video,.guide .m img{width:100%;height:100%;object-fit:cover;display:block}
  .bubble{position:relative;background:var(--field);border:1px solid var(--line);border-radius:6px 16px 16px 16px;
    padding:12px 15px;font-weight:800;font-size:clamp(18px,4.6vw,22px);letter-spacing:-.01em;line-height:1.22;
    box-shadow:0 12px 26px -18px rgba(0,0,0,.25)}
  .bubble::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;background:var(--field);
    border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
  .q-sub{color:var(--muted);font-size:15px;margin:14px 0 0 2px}
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:22px}

  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--field);border:1.5px solid var(--line);border-radius:16px;padding:16px 17px;
    color:var(--ink);font-size:16px;transition:.16s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.16s}
  .opt.sel .ic{background:var(--accent)}
  .opt .ic svg{width:22px;height:22px;stroke:var(--accent);transition:.16s}
  .opt.sel .ic svg{stroke:var(--cta-ink)}
  .opt .tx{flex:1;min-width:0}
  .opt .tx b{display:block;font-weight:700;font-size:16px}
  .opt .tx span{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
  .opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.16s}
  .opt.sel .mk{border-color:var(--accent);background:var(--accent)}
  .opt .mk svg{width:13px;height:13px;stroke:var(--cta-ink);opacity:0;transition:.16s}
  .opt.sel .mk svg{opacity:1}
  .opt.sq .mk{border-radius:7px}

  /* Свободные исключения на шаге ограничений: нижняя строка, не отдельный шаг. */
  .freein{margin-top:14px}
  .freein input{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:15px;
    padding:14px 16px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;transition:.16s}
  .freein input:focus{border-color:var(--accent)}
  .freein input::placeholder{color:var(--muted);opacity:.65}
  .freehint{color:var(--muted);font-size:12.5px;margin-top:7px;padding-left:2px}

  /* metrics */
  .metrics{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  /* Подпись сверху, ввод под ней — а не в одну строку.
     В одну строку подпись стояла flex:0 0 auto, то есть не сжималась, и на
     «Желаемый вес (по желанию)» выдавливала число с единицей ЗА правый край
     карточки. Плюс по такой строке не видно, что это поле: серое «170» справа
     читалось как готовое значение, а не как приглашение ввести своё.

     Теперь карточка кликается целиком (cursor:text + фокус по нажатию), а под
     числом лежит подчёркивание — привычный признак ввода, который виден и без
     фокуса. */
  .field{background:var(--field);border:1.5px solid var(--line);border-radius:16px;
    padding:11px 16px 12px;transition:.16s;cursor:text}
  .field:focus-within{border-color:var(--accent)}
  .field .lb{display:block;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.01em}
  .field .in{display:flex;align-items:baseline;gap:8px;margin-top:2px;
    border-bottom:2px solid var(--line);transition:.16s}
  .field:focus-within .in{border-bottom-color:var(--accent)}
  .field input{flex:1 1 auto;min-width:0;width:100%;border:none;background:transparent;
    color:var(--ink);font-size:24px;font-weight:800;outline:none;padding:2px 0 5px;
    -moz-appearance:textfield}
  .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  /* Плейсхолдер должен ЧИТАТЬСЯ как подсказка. Раньше он наследовал размер и
     насыщенность введённого значения, и пустое поле выглядело заполненным:
     человек считал шаг пройденным и упирался в кнопку, которая молчит. */
  .field input::placeholder{color:var(--muted);opacity:.45;font-weight:600}
  .field.bad{border-color:#DC2626}
  .field.bad .in{border-bottom-color:#DC2626}
  .mhint{color:#DC2626;font-size:13.5px;margin-top:10px;display:none}
  .mhint.show{display:block}
  .cta.dim{opacity:.55}
  .field .u{color:var(--muted);font-size:14px;font-weight:700;flex:0 0 auto}

  /* bottom CTA */
  /* z-index обязателен: backdrop-filter на стеклянных карточках создаёт НОВЫЙ
     контекст наложения, и карточка начала перекрывать липкую кнопку — клик по
     «Показать мою норму» перехватывался текстом подсказки. Поймано e2e. */
  /* Подвал закрашивает фон под собой, чтобы карточки уезжали под кнопку, а не
     сквозь неё.

     Заливка живёт в ::before и прибита к низу ОКНА, а не к самому подвалу.
     Пока она была фоном .foot, её края было видно светлым прямоугольником:
     по бокам она кончалась на отступах .shell, снизу — на 11px выше низа
     страницы (высоту подвала определяла раскладка flex, и посчитать её в CSS
     заранее нельзя), а под ней лежит не ровный --bg, а свечение и фото блюд.
     Стоило докрутить до конца — и подвал отлипал, оставляя прямоугольник
     посреди контента.

     Фиксированный слой этой арифметики не знает: он всегда во всю ширину и
     всегда у нижней кромки, поэтому обрывов не остаётся ни при какой прокрутке
     и ни на какой ширине. z-index:-1 держит его под кнопкой, но внутри
     стекового контекста .foot — то есть над карточками. */
  .foot{position:sticky;bottom:0;z-index:4;padding:16px 0 calc(10px + env(safe-area-inset-bottom));
    margin-top:22px}
  .foot::before{content:'';position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-1;
    pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 48%)}
  .cta{width:100%;border:none;border-radius:15px;background:var(--accent);color:var(--cta-ink);
    font-size:17px;font-weight:800;padding:17px;transition:.16s;box-shadow:0 14px 30px -14px var(--accent)}
  .cta:hover:not(:disabled){background:var(--accent-d)}
  .cta:disabled{opacity:.4;box-shadow:none;cursor:default}
  .trust{text-align:center;color:var(--muted);font-size:12.5px;margin-top:11px}
  .trust a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .skip{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-size:14px;
    font-weight:600;text-decoration:underline;text-underline-offset:3px}

  /* intro / rapport screens */
  .intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:20px 0 8px;min-height:70dvh}
  .intro .bub{background:var(--field);border:1px solid var(--line);border-radius:22px;padding:20px 22px;
    font-weight:800;font-size:clamp(22px,6vw,30px);letter-spacing:-.02em;line-height:1.18;max-width:15ch;
    box-shadow:0 20px 40px -26px rgba(0,0,0,.28);position:relative;animation:pop .4s ease}
  .intro .bub::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:16px;height:16px;background:var(--field);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .intro .mbig{width:min(60vw,220px);aspect-ratio:1;border-radius:32px;overflow:hidden;background:var(--soft);
    margin-top:30px;box-shadow:0 40px 70px -34px rgba(0,0,0,.35);animation:pop .5s ease}
  .intro .mbig video,.intro .mbig img{width:100%;height:100%;object-fit:cover;display:block}
  /* note / подбадривание — маскот сверху, потом текст */
  .note .mbig{margin-top:0;margin-bottom:22px;width:min(46vw,170px)}
  .nt-h{font-size:clamp(23px,5.6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.18;max-width:16ch}
  .nt-b{color:var(--muted);font-size:16px;margin-top:12px;max-width:32ch}
  .nt-l{list-style:none;margin-top:24px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;max-width:340px}
  .nt-l li{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
  .nt-l li .c{width:26px;height:26px;border-radius:50%;background:var(--accent);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .nt-l li .c svg{width:14px;height:14px;stroke:var(--cta-ink)}

  /* build loader — circular */
  .build{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:10px}
  .ringwrap{position:relative;width:180px;height:180px;margin:0 auto}
  .ringwrap svg{transform:rotate(-90deg)}
  .ringwrap .pc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;letter-spacing:-.02em}
  .ringwrap .mc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ringwrap .mc .mm{width:74px;height:74px;border-radius:20px;overflow:hidden;background:var(--soft);opacity:0;transition:.4s}
  .ringwrap.done .mc .mm{opacity:1}
  .ringwrap.done .pc{opacity:0}
  .ringwrap .mm video,.ringwrap .mm img{width:100%;height:100%;object-fit:cover;display:block}
  .build h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:26px 0 0}
  .checks{list-style:none;margin:26px auto 0;max-width:320px;display:flex;flex-direction:column;gap:12px;text-align:left}
  .checks li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);opacity:.4;transition:.3s}
  .checks li.on{opacity:1;color:var(--ink)}
  .checks li .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.3s}
  .checks li.on .c{border-color:var(--accent);background:var(--accent)}
  .checks li .c svg{width:13px;height:13px;stroke:var(--cta-ink);opacity:0;transition:.3s}
  .checks li.on .c svg{opacity:1}

  /* plan preview */
  .plan{padding-top:6px;position:relative}
  .plan .kick{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent-d);
    font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;padding:6px 13px;border-radius:99px}
  .plan h2{font-size:clamp(23px,5.6vw,30px);font-weight:800;letter-spacing:-.02em;margin:14px 0 2px}
  .plan h2 em{color:var(--accent-d);font-style:normal}
  .plan .lead{color:var(--muted);font-size:15px}
  /* prognosis graph */
  .prog{margin-top:18px;background:var(--field);border:1.5px solid var(--line);border-radius:22px;
    padding:16px 18px 14px;overflow:hidden}
  /* Шапка карточки: слева — что это, справа — САМОЕ ГЛАВНОЕ число, дельта.
     Раньше её не было вовсе: разницу человек должен был вычитать в уме. */
  .prog .ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
  .prog .glabel{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .prog .gdelta{background:linear-gradient(160deg,var(--accent),var(--accent-d));color:var(--cta-ink);
    font-size:14px;font-weight:800;padding:6px 13px;border-radius:99px;white-space:nowrap;
    box-shadow:0 10px 22px -10px color-mix(in srgb,var(--accent-d) 80%,transparent),
               inset 0 1px 0 color-mix(in srgb,#fff 28%,transparent)}
  .prog .gwrap{position:relative;height:150px;margin:14px 0 26px}
  .prog svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  /* Кружки и подписи — HTML поверх SVG, а не фигуры внутри него: SVG растянут
     по ширине (preserveAspectRatio=none), и любая окружность в нём превращалась
     в овал. Заодно ничего не наезжает друг на друга. */
  .prog .dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
  .prog .dot.start{width:13px;height:13px;background:var(--field);border:3px solid var(--curve)}
  .prog .dot.end{width:15px;height:15px;background:var(--accent);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
  /* Подписи веса — просто текст. Плашки вокруг каждой цифры превращали
     график в набор наклеек; в макете они читаются как разметка на линии. */
  .prog .kg{position:absolute;transform:translate(-50%,-50%);font-size:13.5px;font-weight:800;
    color:var(--ink);white-space:nowrap}
  .prog .kg.start{font-size:13.5px}
  .prog .kg.end{font-size:14px}
  .prog .endm{position:absolute;width:52px;height:52px;border-radius:15px;overflow:hidden;background:var(--soft);
    transform:translate(-50%,-100%);box-shadow:0 14px 26px -14px rgba(0,0,0,.3)}
  .prog .endm video,.prog .endm img{width:100%;height:100%;object-fit:cover;display:block}
  .prog .tag{position:absolute;transform:translate(-50%,-50%);background:var(--field);border:1px solid var(--line);
    border-radius:10px;padding:4px 9px;font-size:13px;font-weight:800;box-shadow:0 8px 18px -10px rgba(0,0,0,.3)}
  /* Вехи на пути. Две точки (старт/финиш) показывают только «откуда» и «куда»;
     промежуточные превращают график в план с этапами — видно, что будет через
     месяц, а не только в ноябре. Веса — линейная интерполяция того же прогноза,
     поэтому в заголовке и стоит «примерно». */
  .prog .mile{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;
    background:var(--field);border:3px solid var(--curve)}
  .prog .mkg{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:700;
    color:var(--muted);white-space:nowrap}
  .prog .guide-v{position:absolute;width:1px;border-left:1px dashed var(--line);opacity:.9}
  .prog .tick{position:absolute;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .prog .axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:8px}
  .card{background:var(--field);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin-top:16px}
  /* Норма — главное число экрана, и подано оно должно быть как число, а не как
     цифра, к которой сбоку приклеен абзац. Раньше блок был flex с
     align-items:baseline: первая строка подписи прилипала к низу цифры, над ней
     зияла пустота высотой в сорок пикселей, а тире в конце висело в воздухе. */
  .kcal{display:block}
  .kcal .knum{display:flex;align-items:baseline;gap:9px}
  .kcal .big{font-size:52px;font-weight:800;color:var(--accent-d);letter-spacing:-.035em;line-height:.95}
  .kcal .kunit{line-height:1.05}
  .kcal .kunit b{display:block;font-size:16px;font-weight:800;color:var(--accent-d)}
  .kcal .kunit span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:0}
  .kcal .klab{margin-top:8px;color:var(--muted);font-size:14.5px;line-height:1.4}
  .macros{display:flex;gap:7px;margin-top:18px}
  /* Песочные, а не мятные: в макете плитки БЖУ — тёплый нейтральный слой, и
     зелёным на экране остаётся только то, что действительно акцент (норма,
     дельта, кнопка). Иконка слева от числа даёт строке ритм. */
  .macros > div{flex:1;min-width:0;background:color-mix(in srgb,var(--bg) 82%,#fff);
    border:1px solid var(--glass-line);border-radius:18px;padding:11px 9px;
    box-shadow:inset 0 1px 0 var(--glass-edge)}
  /* Иконка слева, число и подпись столбиком справа. Раньше подпись висела под
     иконкой, то есть под пустым местом, а не под тем числом, к которому
     относится. */
  .macros .mrow{display:flex;align-items:center;gap:7px}
  .macros .mtx{min-width:0}
  .macros b{display:block;font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
  .macros b i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
  .macros span{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
  /* Иллюстрации в стиле маскота вместо плоских значков — свой вес у них уже

  .macros .mic{width:27px;height:27px;flex:0 0 auto}
  .macros .mic img{width:100%;height:100%;display:block}
  .day{margin-top:14px}
  .day .dh{font-size:14px;font-weight:800;color:color-mix(in srgb,var(--ink) 78%,transparent);

  .meal{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .meal .mi{width:34px;height:34px;border-radius:10px;background:var(--soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  /* С фотографией строка становится витриной, а не списком: 34px хватало
     иконке, но еду в таком размере не разглядеть — а ради «понятно, что
     покупаешь» всё и затевалось. */
  .meal.hasphoto .mi{width:56px;height:56px;border-radius:13px}
  .meal.hasphoto{padding:11px 0}
  .meal .mi svg{width:18px;height:18px;stroke:var(--accent)}
  /* Фото блюда встаёт на место иконки: человек видит СВОЙ завтрак, а не
     абстрактный значок. Картинки уже есть — общий кэш по слагу, /dish/<slug>. */
  .meal .mi img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
  .meal .mi{overflow:hidden}
  .meal .mt{min-width:0}
  .meal .mt b{display:block;font-size:14.5px}
  .meal .mt span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
  /* Калории в макете тёмные: это значимое число, а не служебная подпись.

  .meal .kc{margin-left:auto;padding-left:8px;font-size:13px;font-weight:700;color:var(--ink);

  .locked{position:relative}

  /* Из надписи «+ещё 6 дней меню» сделана кнопка. Надпись сообщала, что за

  /* На всю ширину и капсом — в макете это главная кнопка экрана, а не

  .locked .veil{padding:0 0 14px}
  .locked .veil .go{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:linear-gradient(160deg,var(--accent),var(--accent-d));color:var(--cta-ink);

  /* Замок на последней (скрытой) строке — «здесь заперто», а не «здесь пусто». */
  .meal .mi.lock{background:var(--line);opacity:.9}

  .email{margin-top:22px}

  .email .inp{margin-top:14px;background:var(--field);border:1.5px solid var(--line);border-radius:15px;padding:15px 17px;display:flex;align-items:center;transition:.16s}
  .email .inp:focus-within{border-color:var(--accent)}
  .email input{width:100%;border:none;background:transparent;color:var(--ink);font-size:16px;outline:none}
  .email .err{color:#DC2626;font-size:13px;margin-top:8px;display:none}
  .email .err.show{display:block}

  /* email-gate.
     Было: четыре точки «••••» и замок. Точки не сообщали, ЧТО откроется, и
     карточка читалась как заглушка вместо готового результата.
     Стало: вся строка КБЖУ на своих местах, числа размыты. Человек видит, что
     за почтой не одна цифра, а норма и три макронутриента.

     Размыто СВОЁ число, посчитанное по ответам, а не подставленное красивое:
     подписи и разрядность настоящие, поэтому обещание совпадает с тем, что
     откроется через секунду. */
  .dh2{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .lockhead{display:flex;align-items:center;gap:9px}
  .lockrow{display:flex;align-items:flex-end;gap:14px;margin-top:12px}
  .lockcell{min-width:0}
  /* Числа не растягиваем под ширину: blur размывает края, и на 390px четыре

  .lockcell .n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;
    color:var(--ink);filter:blur(6px);opacity:.6;user-select:none}
  .lockcell.main .n{font-size:38px;color:var(--accent-d)}
  .lockcell .c{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}
  .lockic{width:26px;height:26px;border-radius:9px;background:var(--soft);display:flex;

  .lockhint{color:var(--muted);font-size:14px;margin-top:16px}

  /* Связка между личным результатом и покупкой. Раньше карточка нормы просто

     плати», без объяснения, за что. */
  .bridge{margin:22px 2px 0;font-size:16px;line-height:1.45}
  .bridge b{font-weight:800}
  .bridge span{color:var(--muted)}

  /* paywall — полный план */
  .pw{margin-top:16px;background:var(--field);border:1.5px solid var(--accent);border-radius:22px;padding:22px 20px;

  .pw-h{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .pw-sub{color:var(--muted);font-size:14px;margin-top:5px}
  .pw-l{list-style:none;margin:18px 0 4px;display:flex;flex-direction:column;gap:13px}
  .pw-l li{display:flex;align-items:flex-start;gap:11px;font-size:15px;line-height:1.35}
  .pw-l li b{display:block;font-weight:700}
  .pw-l li i{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:1px}
  .pw-l li .c{width:26px;height:26px;border-radius:9px;background:var(--soft);flex:0 0 auto;margin-top:1px;
    display:flex;align-items:center;justify-content:center}
  .pw-l li .c svg{width:15px;height:15px;stroke:var(--accent-d);fill:none;stroke-width:2;

  .tars{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .tar{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:16px;

  .tar .trad{margin-top:2px}
  .tar:hover{border-color:#c9dfd0}
  .tar.sel{border-color:var(--accent);border-width:2px;background:var(--soft);padding:16px 15px}
  .tar .trad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;position:relative}
  .tar.sel .trad{border-color:var(--accent)}
  .tar.sel .trad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
  .tar .tl{flex:1;min-width:0}
  .tar .tl b{display:flex;align-items:center;gap:7px;font-size:16px;flex-wrap:wrap;line-height:1.25}
  .tbadge{background:var(--accent);color:var(--cta-ink);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
  .tdesc{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .tp{text-align:right;white-space:nowrap;flex:0 0 auto}
  .tp b{display:block;font-size:22px;font-weight:800;color:var(--accent-d);line-height:1.1}
  .tp small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

  /* Честные опоры вместо мелкой серой строчки: то, что реально выполняется. */
  .pw-trust{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .pw-trust span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .pw-trust svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  .done{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px;animation:in .4s ease}
  .done.show{display:flex}
  .done .ring{width:88px;height:88px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px -20px var(--accent)}
  .done .ring svg{width:44px;height:44px;stroke:var(--cta-ink);stroke-width:3}
  .done h2{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:22px 0 8px}
  .done p{color:var(--muted);font-size:16px;max-width:34ch}
  .done .mail{color:var(--ink);font-weight:700}

  @media(max-width:380px){.opt{padding:14px}.opt .ic{width:38px;height:38px}}

  /* ═══ Стекло ══════════════════════════════════════════════════════════════
     Материал вместо плоских белых прямоугольников: под контентом — мягкое
     цветное свечение, карточки полупрозрачные и размывают то, что за ними.
     Ощущение стекла даёт не сама прозрачность, а СВЕТЯЩАЯСЯ КРОМКА сверху
     (inset-подсветка) — без неё выходит просто мутный прямоугольник.

     Все цвета выведены из переменных темы, поэтому восемь лендингов сохраняют
     свою палитру, а не получают один общий фиолетовый градиент.               */
  :root{
    --glass: color-mix(in srgb, var(--field) 58%, transparent);
    --glass-soft: color-mix(in srgb, var(--field) 42%, transparent);
    --glass-edge: color-mix(in srgb, #fff 70%, transparent);
    --glass-line: color-mix(in srgb, var(--ink) 8%, transparent);
    /* Линия прогноза в макете заметно бледнее акцента: насыщенный зелёный
       кричал громче, чем плашка с дельтой, и спорил с ней за внимание. */
    --curve: color-mix(in srgb, var(--accent) 42%, #fff);
  }

  /* Подсветка за контентом. Три пятна, а не десять: каждое — это большой
     размытый слой, и на телефоне за них платят батареей. */
  /* Слой ровно по вьюпорту. Раньше был inset:-20% -10% — то есть шире экрана;
     фиксированный слой в iOS Safari умеет тянуть страницу боком. Свечение
     никуда не делось: пятна задаются позициями фона, а фон за свою коробку
     не выходит по определению. */
  .aura{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(36% 26% at 14% 8%,  color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%),
      radial-gradient(40% 30% at 92% 26%, color-mix(in srgb, var(--soft) 96%, transparent), transparent 72%),
      radial-gradient(46% 30% at 8% 58%,  color-mix(in srgb, var(--accent) 20%, transparent), transparent 74%),
      radial-gradient(54% 34% at 78% 84%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 72%);
    filter:blur(34px);opacity:1}

  .plan .card, .plan .prog, .plan .pw{
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(170%);
    backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--glass-line);
    box-shadow:
      inset 0 1px 0 var(--glass-edge),          /* кромка, ловящая свет */
      inset 0 -1px 0 color-mix(in srgb, var(--ink) 4%, transparent),
      0 26px 50px -34px color-mix(in srgb, var(--ink) 40%, transparent);
  }
  .plan .pw{border-color:color-mix(in srgb, var(--accent) 38%, transparent)}

  /* Вложенные плитки — тоньше и без своего размытия: вкладывать backdrop-filter
     друг в друга дорого, а разницы почти не видно. */
  .plan .macros > div, .plan .tar{
    background:var(--glass-soft);
    border:1px solid var(--glass-line);
    box-shadow:inset 0 1px 0 var(--glass-edge);
  }
  .plan .tar.sel{
    background:color-mix(in srgb, var(--soft) 72%, transparent);
    border-color:var(--accent);
  }
  /* Туман над скрытым днём должен растворяться в стекле, а не в белом листе. */
  .plan .locked .veil{
    background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--field) 72%, transparent) 76%);
  }

  /* Если браузер не умеет размытие — материал становится плотным, иначе текст
     поплывёт по цветным пятнам. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .plan .card, .plan .prog, .plan .pw{background:var(--field)}
    .plan .macros > div, .plan .tar{background:var(--soft)}
  }
  /* Уважаем системную просьбу убрать прозрачность. */
  @media (prefers-reduced-transparency: reduce){
    .aura{display:none}
    .plan .card, .plan .prog, .plan .pw{background:var(--field);backdrop-filter:none;-webkit-backdrop-filter:none}
    .plan .macros > div, .plan .tar{background:var(--soft)}
  }

  /* Фотография еды по краям, за стеклом. В макете именно она делает экран
     аппетитным: без неё карточки висят в пустоте. Снимки берём из общего кэша
     блюд (те же, что в плане), а не из стока — показываем свою еду.

     Три ограничения, чтобы это не мешало читать:
       · слой лежит ПОД карточками (z-index -1) и над свечением;
       · края растворяются маской, снимок не имеет видимой рамки;
       · pointer-events отключены — картинка не перехватывает касания.        */
  .food{position:absolute;z-index:-1;pointer-events:none;border-radius:50%;
    background-size:cover;background-position:center;opacity:.6;filter:saturate(105%)}
  .food.a{width:230px;height:230px;right:-86px;top:96px;
    -webkit-mask-image:radial-gradient(closest-side,#000 42%,transparent 78%);
    mask-image:radial-gradient(closest-side,#000 42%,transparent 78%)}
  .food.b{width:170px;height:170px;left:-78px;top:330px;
    -webkit-mask-image:radial-gradient(closest-side,#000 38%,transparent 76%);
    mask-image:radial-gradient(closest-side,#000 38%,transparent 76%)}
  @media (prefers-reduced-transparency: reduce){ .food{display:none} }
  /* Украшения намеренно выходят за карточку — и на телефоне это выносило
     страницу за вьюпорт: при 390px документ был 456px, мобильный браузер
     отзумливал ВСЮ вёрстку, карточка сжималась до 350px, а колонка текста —
     до 156px. Отсюда и переносы в названиях блюд.

     Именно clip, а не hidden: hidden делает элемент контейнером прокрутки и
     ломает position:sticky, а на sticky держится кнопка оплаты. Старым Safari
     clip неизвестен — там останется как было, хуже не станет. */
  /* Украшения намеренно выезжают за карточку — вылет НЕ убираем, обрезаем его.
     Резать нужно именно на .shell, а не на html: overflow-x:clip у корня НЕ
     мешает мобильному браузеру расширить layout viewport под вылезший контент.
     Проверено — при экране 390px clientWidth оставался 390, зато innerWidth
     становился 456: браузер отзумливал страницу, и палец таскал её боком, хотя
     window.scrollTo честно отвечал нулём. Отсюда и «скролл вернулся».

     clip, а не hidden: hidden сделал бы .shell контейнером прокрутки и сломал
     position:sticky, на котором держится кнопка оплаты. clip контейнером
     прокрутки не становится.

     На телефоне обрез совпадает с кромкой экрана, так что картинка не меняется
     — за экран всё равно не видно. Широкий вылет за .shell возвращаем с 700px:
     .shell упирается в 520px, значит по бокам свободно больше 86px. */
  .shell{overflow-x:clip}
  @media (min-width:700px){
    .shell{overflow-x:visible}
  }
  html{overflow-x:clip}
</style>
</head>

<div class="shell">

<script>
const L = "__LANDING__", SRC = "__SRC__", DARK = __DARK__, PRICE = __PRICE__, SUB_PRICE = __SUB_PRICE__;
// маскот: мелкое ужатое видео (10-40КБ) + превью-постер — для маленьких мест (гид/лоадер/прогноз)
const masc = (pose='wave') => `<video autoplay loop muted playsinline poster="/assets/avocado_${pose}_sm.png"><source src="/assets/avocado_${pose}_sm.mp4" type="video/mp4"></video>`;
// Крупные места (.mbig). Контейнер задан как min(60vw,220px), то есть
// 220 CSS-пикселей ВЕЗДЕ — и на мониторе, и на телефоне. Физический размер
// равен 220 × devicePixelRatio, поэтому решает плотность экрана, а не «десктоп
// против мобильного»: телефону с DPR 3 нужно 660 пикселей, обычному монитору —
// 220. Делить по ширине окна было бы ровно наоборот.
//
//   DPR < 1.5  → 240 (18–40 КБ)   обычный монитор
//   DPR < 2.5  → 480 (65–205 КБ)  ретина, большинство телефонов
//   DPR ≥ 2.5  → 720 (110–290 КБ) плотные экраны телефонов
//
// Save-Data («экономия трафика» в браузере) опускает на ступень вниз: человек
// прямо попросил не тратить его мегабайты.
const MASC_TIER = (() => {
  try {
    const c = navigator.connection || {};
    const dpr = window.devicePixelRatio || 1;
    let t = dpr >= 2.5 ? '_lg' : (dpr >= 1.5 ? '_md' : '_sm');
    if (c.saveData) t = t === '_lg' ? '_md' : '_sm';
    return t;
  } catch (e) { return '_md'; }
})();

// Цели воронки. Имена — ровно те, что заведены в Метрике (см. e2e/README и
// доктрину site-analytics: цели создаются по событиям, которые сайт РЕАЛЬНО
// шлёт, иначе они мёртвые). npGoal ставит счётчик; без счётчика — тихо ничего.
const GOALS_SENT = {};
// Имя track, а не goal: в renderPlan уже есть локальная const goal (текст цели
// «для похудения»), и она затеняла хелпер — цели молча падали с
// "goal is not a function" ровно на шаге отправки почты.
function track(name){
  if(GOALS_SENT[name]) return;          // один раз за сессию: шаг можно открыть дважды кнопкой «назад»
  GOALS_SENT[name] = 1;
  try{ if(window.npGoal) window.npGoal(name); }catch(e){}
}

function render(){
  const st=STEPS[idx];
  const chrome = st.q || st.type==='metrics';
  // Точки, где воронка реально теряет людей: старт, шаг с ростом/весом
  // (там была мёртвая кнопка), экран с почтой и раскрытая норма.
  if(idx===0) track('quiz_start');
  if(st.type==='metrics') track('quiz_metrics');
  if(st.type==='plan') track(planRevealed ? 'quiz_norm_shown' : 'quiz_email_screen');
  // топ-бар (с кнопкой «Назад») виден везде, КРОМЕ intro/build/plan — иначе на note-экранах
  // юзер не мог вернуться и поправить ответ (кнопка была спрятана вместе с баром).
  topEl.classList.toggle('hide', st.type==='intro' || st.type==='build' || st.type==='plan');
  back.hidden = idx===0 || st.type==='build' || st.type==='plan';
  if(st.q){ const n=qNum(idx); fill.style.width=(n/QTOTAL*100)+'%'; count.textContent=n+'/'+QTOTAL; }
  if(st.type==='intro') renderIntro(st);
  else if(st.type==='note') renderNote(st);
  else if(st.type==='single'||st.type==='multi') renderChoice(st);
  else if(st.type==='metrics') renderMetrics(st);
  else if(st.type==='build') renderBuild();
  else if(st.type==='plan') renderPlan();
  playAll();
}

function renderChoice(st){
  const multi = st.type==='multi';
  stage.innerHTML = `<div class="step">
    ${guide(st.h, st.pose)}${st.sub?`<p class="q-sub">${st.sub}</p>`:''}
    <div class="opts">${st.opts.map(o=>optRow(st,o)).join('')}</div>
    ${st.free?`<div class="freein">
      <input type="text" id="freeIn" placeholder="${st.free.ph}" value="${(answers[st.free.key]||'').replace(/"/g,'&quot;')}" autocomplete="off">
      <div class="freehint">${st.free.label}</div></div>`:''}
    <div class="foot"><button class="cta" id="next">Далее</button>${st.skip?`<button class="skip" id="skip">Пропустить</button>`:''}</div>
  </div>`;
  const nx=$('#next');
  const canNext = () => multi ? !!(answers[st.key] && answers[st.key].length) : (answers[st.key] != null);
  nx.disabled = !canNext();
  stage.querySelectorAll('.opt').forEach(el=>el.addEventListener('click', ()=>{
    const v=el.dataset.v;
    if(!multi){
      answers[st.key]=v;
      stage.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===el));  // можно перевыбрать
      nx.disabled=false; saveState();
    } else {
      let arr=answers[st.key]||[]; const o=st.opts.find(x=>x.v===v);
      if(o.solo){ arr=arr.includes(v)?[]:[v]; }
      else{ arr=arr.filter(x=>{const so=st.opts.find(y=>y.v===x);return !(so&&so.solo);}); arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; }
      answers[st.key]=arr; saveState();
      // Раньше тут стоял renderChoice(st) — полная перерисовка экрана на КАЖДЫЙ
      // тап. Вместе с innerHTML заново запускалась входная анимация .step и
      // перезапускалось видео маскота: экран моргал и выглядел так, будто
      // отрисовывается с нуля. Состояние отражается классами, DOM пересобирать
      // незачем.
      stage.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', arr.includes(x.dataset.v)));
      nx.disabled = !canNext();
    }
  }));
  if(st.free){
    const fi=$('#freeIn');
    // Пустая строка — это ответ «ничего не исключаю», её и сохраняем.
    fi.addEventListener('input', ()=>{ answers[st.free.key]=fi.value.trim(); saveState(); });
  }
  nx.addEventListener('click', nextStep);
  if(st.skip) $('#skip').addEventListener('click', ()=>{ answers[st.key]=answers[st.key]||[]; nextStep(); });
}

function renderMetrics(st){
  const b=answers[st.key]||{};
  stage.innerHTML = `<div class="step">
    ${guide(st.h, st.pose)}${st.sub?`<p class="q-sub">${st.sub}</p>`:''}
    <div class="metrics">${st.fields.map(f=>`
      <label class="field"><span class="lb">${f.label}${f.opt?' <span style="opacity:.6">(по желанию)</span>':''}</span>
        <span class="in"><input type="number" inputmode="numeric" data-k="${f.k}" placeholder="${f.ph}" min="${f.min}" max="${f.max}" value="${b[f.k]||''}"><span class="u">${f.u}</span></span></label>`).join('')}
    </div>
    <div class="foot"><button class="cta" id="next">Далее</button>
      <div class="mhint" id="mhint"></div>
      <div class="trust">Данные нужны только для расчёта — не публикуются</div></div>
  </div>`;
  const nx=$('#next'), hint=$('#mhint');
  // Какие обязательные поля не заполнены (или вне диапазона).
  const missing=()=>{ const o={};
    stage.querySelectorAll('input').forEach(i=>{ if(i.value) o[i.dataset.k]=+i.value; });
    answers[st.key]=o;
    return st.fields.filter(f=>!f.opt).filter(f=>{ const v=o[f.k]; return !v||v<f.min||v>f.max; }); };
  const chk=()=>{ const bad=missing();
    nx.classList.toggle('dim', bad.length>0);
    if(!bad.length){ hint.classList.remove('show');
      stage.querySelectorAll('.field.bad').forEach(el=>el.classList.remove('bad')); } };
  stage.querySelectorAll('input').forEach(i=>i.addEventListener('input',chk)); chk();
  // Кнопка НЕ отключена: раньше она была disabled и на нажатие не отвечала
  // ничем — при плейсхолдерах, похожих на значения, это читалось как «сайт
  // сломан». Отказ должен быть громким: подсвечиваем поле и говорим, чего ждём.
  nx.addEventListener('click', ()=>{
    const bad=missing();
    if(!bad.length){ hint.classList.remove('show'); nextStep(); return; }
    const names=bad.map(f=>f.label.toLowerCase()).join(' и ');
    hint.textContent = `Укажи ${names} — без этого не посчитать норму калорий`;
    hint.classList.add('show');
    stage.querySelectorAll('.field.bad').forEach(el=>el.classList.remove('bad'));
    const first=stage.querySelector(`input[data-k="${bad[0].k}"]`);
    if(first){ first.closest('.field').classList.add('bad'); first.focus(); }
  });
}

// Персист состояния квиза: refresh/сворачивание вкладки не должны стирать 11 шагов и пейволл.
const SKEY='np_quiz_v2';
function saveState(){ try{ localStorage.setItem(SKEY, JSON.stringify(
  {answers, idx, planRevealed, leadEmail, t:Date.now()})); }catch(e){} }
function loadState(){ try{ const s=JSON.parse(localStorage.getItem(SKEY)||'null');
  if(s && s.answers && (Date.now()-(s.t||0) < 864e5)){ // не старше суток
    Object.assign(answers, s.answers); idx=Math.min(s.idx||0, STEPS.length-1);
    planRevealed=!!s.planRevealed; leadEmail=s.leadEmail||'';
    if(STEPS[idx] && STEPS[idx].type==='build') idx=Math.max(0, idx-1); // build транзиентный
    return true; } }catch(e){} return false; }
function clearState(){ try{ localStorage.removeItem(SKEY); }catch(e){} }
function nextStep(){ idx++; saveState(); render(); window.scrollTo(0,0); }
back.addEventListener('click', ()=>{ if(idx>0){ idx--; saveState(); render(); window.scrollTo(0,0);} });

    if(p>=100){ clearInterval(tick); lis.forEach(li=>li.classList.add('on')); rw.classList.add('done'); setTimeout(nextStep,550); }
  }, 140);

function calcPlan(){
  const g=answers.gender==='m'?5:-161, age=+answers.age||32, b=answers.body||{};
  const w=+b.weight||70, h=+b.height||170;
  const bmr=10*w+6.25*h-5*age+g;
  const af={sed:1.2,light:1.375,mod:1.55,high:1.725}[answers.activity]||1.375;
  let cal=bmr*af;
  if(answers.goal==='lose') cal*=0.80; else if(answers.goal==='gain') cal*=1.12;
  cal=Math.max(cal, answers.gender==='m'?1500:1200); // порог: не показываем экстремальный дефицит
  cal=Math.round(cal/10)*10;
  return {cal, P:Math.round(cal*0.30/4), F:Math.round(cal*0.30/9), C:Math.round(cal*0.40/4), w, target:+b.target||0};
}
const GOAL_TXT={lose:'снижения веса',keep:'поддержания формы',gain:'набора массы',health:'здорового питания'};

function prognosis(w,target,goal){
  // возвращает {headline, curveDown, weeks, dateStr, endLabel}
  let weeks=8, endLabel='', down = goal!=='gain';
  // target учитываем только если он согласован с целью (lose → меньше текущего, gain → больше),
  // иначе прогноз рисует абсурд («похудеешь» до веса БОЛЬШЕ текущего).
  const valid = target && ((goal==='lose' && target < w) || (goal==='gain' && target > w));
  if(valid && Math.abs(w-target)>=1){
    const diff=Math.abs(w-target), perWeek=goal==='gain'?0.35:0.6;
    weeks=Math.max(3, Math.min(52, Math.round(diff/perWeek)));
    endLabel=target+' кг';
  }
  const d=new Date(); d.setDate(d.getDate()+weeks*7);
  const dateStr=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const headline = endLabel
    ? `Ты придёшь к <em>${endLabel}</em> примерно к ${dateStr}`
    : `Первые результаты — уже через <em>${weeks} недель</em>`;
  return {headline, down, dateStr, endLabel, weeks};
}

// Настоящий первый день плана + фото блюд.
//
// В вёрстке лежит запасной вариант (овсянка/курица/рыба) — он рисуется сразу,
// чтобы экран не мигал пустотой и не сломался при отвалившейся сети. Но
// показывать его ВСЕМ было ошибкой: человек, ответивший «без мяса», читал
// «Собран под твои вкусы», а под этим — курицу и рыбу. Сервер считает день по
// тем же правилам, что и бесплатное письмо, так что экран и письмо совпадают.
async function loadRealDay(){
  const box = document.getElementById('dayBlock');
  if(!box) return;
  let data;
  try{
    const r = await fetch('/api/preview/day', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({quiz:answers})});
    data = await r.json();
  }catch(e){ return; }                    // сеть отвалилась — остаётся запасной день
  const meals = (data && data.meals) || [];
  if(!meals.length) return;
  const rows = box.querySelectorAll('.meal');
  meals.slice(0, rows.length).forEach((m, i) => {
    const row = rows[i];
    // Фото ставим ТОЛЬКО когда оно реально есть: заглушка-кружок на месте
    // иконки выглядит как сломанная картинка, иконка честнее.
    if(m.photo && m.slug){
      const img = document.createElement('img');
      img.src = '/dish/' + encodeURIComponent(m.slug);
      img.alt = m.title; img.loading = 'lazy';
      const mi = row.querySelector('.mi');
      if(mi){ mi.innerHTML = ''; mi.appendChild(img); row.classList.add('hasphoto'); }
    }
    const t = row.querySelector('.mt');
    if(t){
      // Крупным — НАЗВАНИЕ блюда, а не «Завтрак». Раньше жирным стоял приём
      // пищи, и человек видел «Завтрак · Яйца, помидоры, зелень», не понимая,
      // что ему предлагают омлет. Название блюда — это и есть то, что продаём.
      // Состав нужен рядом: по одному названию не понять, что в тарелке.
      const esc = v => String(v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      t.innerHTML = '<b>' + esc(m.title) + '</b><span>' + esc(m.desc || '') + '</span>';
    }
    // Правая колонка: приём пищи мелким над калориями. Собираем разметкой, а не
    // textContent — присваивание текстом стирало подпись «Завтрак» вместе с
    // тегом, и приём пищи пропадал с экрана совсем.
    const kc = row.querySelector('.kc');
    if(kc){
      const esc2 = v => String(v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      kc.innerHTML = (m.meal ? '<i>' + esc2(m.meal) + '</i>' : '') + esc2(m.kcal) + ' ккал';
    }
  });
}

let planRevealed=false, leadEmail='';
function renderPlan(){
  const {cal,P,F,C,w,target}=calcPlan();
  const goal=GOAL_TXT[answers.goal]||'твоей цели';
  const pg=prognosis(w,target,answers.goal);
  const m1=Math.round(cal*0.30), m2=Math.round(cal*0.40), m3=Math.round(cal*0.30);

  // Числа для оффера — считаются из ответов и из цен, пришедших с сервера.
  // Никаких «обычно 2990₽» и прочих зачёркиваний: сравнивать можно только то,
  // что мы действительно берём.
  const MEALS_N = {'2':2, '3':3, '3s':5, 'if':2};
  const mealsN = MEALS_N[answers.meals] || 3;
  const mealsTxt = mealsN + ' ' + (mealsN===1?'приём':(mealsN<5?'приёма':'приёмов')) + ' пищи в день';
  const dishCount = mealsN * 7;
  // 14 блюд, 21 блюдо, 35 блюд — без склонения на экране висело «21 блюд».
  const plural = (n, one, few, many) => {
    const d10 = n % 10, d100 = n % 100;
    if (d10 === 1 && d100 !== 11) return one;
    if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return few;
    return many;
  };
  const dishWord = plural(dishCount, "блюдо", "блюда", "блюд");
  // Подписка — новый план каждую неделю, то есть ~4 плана в месяц. Отсюда
  // честная цена за план, которая и объясняет бейдж вместо голого «выгодно».
  const perPlan = Math.round(SUB_PRICE / 4);
  const subDay = Math.round(SUB_PRICE / 30);
  const onceDay = Math.round(PRICE / 7);
  const y0 = pg.down ? 34 : 116, y1 = pg.down ? 116 : 34;
  const path = `M 10 ${y0} C 120 ${y0}, 150 ${y1}, 288 ${y1}`;
  // Прогноз веса. Числа те же, что в заголовке, — меняется только то, КАК они
  // поданы: раньше маскот наезжал на подпись «60 кг», та ломалась на две строки
  // и закрывала дату, а кружки внутри растянутого SVG превращались в овалы.
  const startKg = Math.round(w);
  const endKg = pg.endLabel ? parseInt(pg.endLabel, 10) : null;
  const deltaKg = endKg !== null ? Math.abs(startKg - endKg) : null;
  const yTop = y1 / 150 * 100;      // высота конечной точки, %
  const yStartPct = y0 / 150 * 100;
  // Точки берём С САМОЙ КРИВОЙ, а не «на глазок»: путь — кубическая кривая
  // Безье, и линейная прикидка увела бы метки с линии.
  const bez = (t, a, b, c, d) => {
    const u = 1 - t;
    return u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d;
  };
  const miles = (() => {
    if (endKg === null) return [];          // без целевого веса промежуточных значений нет
    const out = [];
    for (const frac of [0.33, 0.66]) {   // две вехи, а не три: на 390px три подписи справа сталкивались с финальной
      // ищем t, при котором x ближе всего к нужной доле ширины
      const wantX = 10 + (288 - 10) * frac;
      let best = 0, bestD = 1e9;
      for (let i = 0; i <= 200; i++) {
        const t = i / 200;
        const d = Math.abs(bez(t, 10, 120, 150, 288) - wantX);
        if (d < bestD) { bestD = d; best = t; }
      }
      const x = bez(best, 10, 120, 150, 288);
      const y = bez(best, y0, y0, y1, y1);
      const prog = (y - y0) / ((y1 - y0) || 1);          // 0 в начале, 1 в конце
      out.push({
        xp: x / 298 * 100,
        yp: y / 150 * 100,
        kg: Math.round(startKg + (endKg - startKg) * prog),
        label: Math.max(1, Math.round(pg.weeks * frac)) + ' нед.',
      });
    }
    return out;
  })();
  const graph = `<div class="prog">
      <div class="ghead">
        <span class="glabel">Прогноз</span>
        ${deltaKg ? `<span class="gdelta">${pg.down ? '−' : '+'}${deltaKg} кг за ${pg.weeks} нед.</span>` : ''}
      </div>
      <div class="gwrap">
        <svg viewBox="0 0 298 150" preserveAspectRatio="none">
          <defs><linearGradient id="pgf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--accent)" stop-opacity=".16"/>

          </linearGradient></defs>
          <path d="${path} L 288 150 L 10 150 Z" fill="url(#pgf)" stroke="none"/>
          ${endKg !== null ? `<line x1="10" y1="${y1}" x2="288" y2="${y1}" stroke="var(--accent)"
            stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round" opacity=".45"
            vector-effect="non-scaling-stroke"/>` : ''}
          <path d="${path}" fill="none" stroke="var(--curve)" stroke-width="5" stroke-linecap="round"
            vector-effect="non-scaling-stroke"/>
        </svg>
        ${miles.map(m => `
          <div class="guide-v" style="left:${m.xp}%;top:${m.yp}%;height:calc(${100 - m.yp}% + 6px)"></div>
          <div class="mile" style="left:${m.xp}%;top:${m.yp}%"></div>
          <div class="mkg" style="left:${m.xp}%;top:calc(${m.yp}% - 17px)">${m.kg} кг</div>
          <div class="tick" style="left:${m.xp}%;top:calc(100% + 9px)">${m.label}</div>`).join('')}
        <div class="tick" style="left:3.4%;top:calc(100% + 9px);transform:translateX(-10%)">Сегодня</div>
        <div class="tick" style="left:96.6%;top:calc(100% + 9px);transform:translateX(-90%)">${pg.dateStr}</div>
        <div class="dot start" style="left:3.4%;top:${yStartPct}%"></div>
        <div class="kg start" style="left:3.4%;top:calc(${yStartPct}% - 20px)">${startKg} кг</div>
        <div class="dot end" style="left:96.6%;top:${yTop}%"></div>
        ${endKg !== null ? `<div class="kg end" style="left:88%;top:calc(${yTop}% ${pg.down ? '- 24px' : '+ 24px'})">${endKg} кг</div>` : ''}
        <!-- Маскота в графике нет намеренно: он либо наезжал на плашку с
             дельтой (кривая вверх), либо садился на саму линию и закрывал
             конечную точку. И по существу он здесь конкурировал с главным —
             числом. На интро-экранах и в пузыре у каждого вопроса он остаётся. -->
      </div>
    </div>`;

  const locked = `
    <div class="card">
      <div class="lockhead"><div class="dh2">Твоя дневная норма</div><span class="lockic">${IC.lock}</span></div>
      <div class="lockrow">
        <div class="lockcell main"><div class="n">${cal}</div><div class="c">ккал в день</div></div>
        <div class="lockcell"><div class="n">${P}</div><div class="c">белки</div></div>
        <div class="lockcell"><div class="n">${F}</div><div class="c">жиры</div></div>
        <div class="lockcell"><div class="n">${C}</div><div class="c">углеводы</div></div>
      </div>
      <p class="lockhint">Норма уже посчитана под твои ответы. Почта — чтобы открыть её и первый день меню.</p>
      <div class="email"><div class="inp"><input type="email" id="mail" placeholder="твой@email.ru" autocomplete="email" inputmode="email"></div>
        <div class="err" id="err">Проверь адрес — кажется, есть опечатка</div></div>
    </div>
    <div class="foot"><button class="cta" id="send">Показать мою норму →</button>
      <div class="trust">Оставляя email, ты принимаешь <a href="/consent" target="_blank">Согласие</a> и <a href="/privacy" target="_blank">Политику ПДн</a></div></div>`;

  const revealed = `
    <div class="card">
      <div class="kcal">
        <div class="knum"><span class="big">${cal}</span>
          <span class="kunit"><b>ккал</b><span>в день</span></span></div>
        <p class="klab">Твоя норма для ${goal} без голода</p>
      </div>
      <div class="macros">
        <div><div class="mrow"><span class="mic"><img src="/assets/macro-prot.svg" alt="" loading="lazy"></span><span class="mtx"><b>${P}<i>г</i></b><span>белки</span></span></div></div>
        <div><div class="mrow"><span class="mic"><img src="/assets/macro-fat.svg" alt="" loading="lazy"></span><span class="mtx"><b>${F}<i>г</i></b><span>жиры</span></span></div></div>
        <div><div class="mrow"><span class="mic"><img src="/assets/macro-carb.svg" alt="" loading="lazy"></span><span class="mtx"><b>${C}<i>г</i></b><span>углеводы</span></span></div></div>
      </div>
      <div class="day locked" id="dayBlock">
        <div class="dh">Пример дня — первый из 7</div>
        <!-- Запасной день = ровно то, что сервер отдаёт без ограничений. Так
             экран не дёргается при подмене на настоящий ответ, а при отвалившейся
             сети человек видит не выдумку, а дефолтное меню каталога. -->
        <div class="meal"><span class="mi">${IC.cup}</span><span class="mt"><b>Омлет с овощами</b><span>Яйца, помидоры, зелень</span></span><span class="kc"><i>Завтрак</i>${m1} ккал</span></div>
        <div class="meal"><span class="mi">${IC.plate}</span><span class="mt"><b>Рыба запеченная с овощами</b><span>Белая рыба и овощи</span></span><span class="kc"><i>Обед</i>${m2} ккал</span></div>
        <div class="meal"><span class="mi">${IC.bowl}</span><span class="mt"><b>Куриное филе с овощами</b><span>Куриное филе и брокколи</span></span><span class="kc"><i>Ужин</i>${m3} ккал</span></div>

      <ul class="pw-l">
        <li><span class="c">${IC.check}</span><span><b>${dishCount} ${dishWord} на неделю</b><i>Каждое — с рецептом, весом порции и КБЖУ</i></span></li>
        <li><span class="c">${IC.check}</span><span><b>Список покупок на всю неделю</b><i>Одним списком, чтобы сходить в магазин один раз</i></span></li>
        <li><span class="c">${IC.check}</span><span><b>Не нравится блюдо — меняешь в один тап</b><i>Замена подбирается под ту же норму</i></span></li>
        <li><span class="c">${IC.check}</span><span><b>План в телефоне, прогресс и вес</b><i>Ставится как приложение, работает и без интернета</i></span></li>
      </ul>

      <div class="tars">

          <div class="tl"><b>Подписка<span class="tbadge">${perPlan} ₽ за план</span></b>
            <span class="tdesc">Новый план каждую неделю · ${subDay} ₽ в день</span></div>
          <div class="tp"><b>${SUB_PRICE} ₽</b><small>в месяц</small></div></label>
        <label class="tar" data-t="once"><span class="trad"></span>
          <div class="tl"><b>Разовый план</b>
            <span class="tdesc">Один план на 7 дней · ${onceDay} ₽ в день</span></div>
          <div class="tp"><b>${PRICE} ₽</b><small>разово</small></div></label>
      </div>

      <div class="foot"><button class="cta" id="pay">Оформить →</button></div>
      <div class="pw-trust">
        <span>${IC.check} Отмена в один клик</span>

      </div>
      <div class="trust" style="margin-top:10px">Нажимая, принимаешь <a href="/offer" target="_blank">Оферту</a></div>
    </div>`;

  stage.innerHTML = `<div class="step plan">
    <div class="food a" aria-hidden="true" style="background-image:url('/dish/grecheskiy-salat')"></div>
    <div class="food b" aria-hidden="true" style="background-image:url('/dish/fruktovyy-salat')"></div>
    <span class="kick">Твой план готов</span>
    <h2>${pg.headline}</h2>
    <p class="lead">Мягкий темп без голода — под твоё тело и вкусы</p>
    ${graph}
    ${planRevealed ? revealed : locked}
  </div>`;
  playAll();
  if(planRevealed){
    loadRealDay();
    // Кнопка из-под тумана ведёт к тарифам. Скроллим сами, а не якорем:
    // якорь оставил бы #hash в адресе и сломал бы возврат «назад».

    if(go) go.addEventListener('click', () => {
      const pw = document.querySelector('.pw');
      if(pw) pw.scrollIntoView({behavior:'smooth', block:'start'});

    // Замок на последнем приёме пищи: под туманом должно читаться «заперто»,
    // а не «здесь пусто».
    const rows = document.querySelectorAll('#dayBlock .meal');
    const last = rows[rows.length - 1];

  if(!planRevealed){
    const send=$('#send'), mail=$('#mail'), err=$('#err');

    mail.addEventListener('input', ()=>err.classList.remove('show'));

      const v=mail.value.trim();

      send.disabled=true; send.textContent='Открываю…';
      // Проверяем ответ сервера: если email отклонён (422) — НЕ раскрываем план, показываем ошибку.
      let good=true;
      try{ const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:v,landing:L,goal:answers.goal||'',quiz:answers,src:SRC})});
        if(r.status===422){ good=false; } }catch(e){ /* сеть — не блокируем раскрытие */ }
      if(!good){ err.textContent='Проверь адрес почты'; err.classList.add('show'); mail.focus();
        send.disabled=false; send.textContent='Показать мой план'; return; }
      track("lead");
      leadEmail=v; planRevealed=true; saveState(); render(); window.scrollTo(0,0);
    });
  } else {
    stage.querySelectorAll('.tar').forEach(el=>el.addEventListener('click', ()=>{
      stage.querySelectorAll('.tar').forEach(x=>x.classList.toggle('sel', x===el));
    }));
    $('#pay').addEventListener('click', startPayment);
  }
}

async function startPayment(){
  const t = document.querySelector('.tar.sel')?.dataset.t || 'sub';
  track(t === 'sub' ? 'pay_click_sub' : 'pay_click_once');
  const url = t==='sub' ? '/api/pay/subscribe' : '/api/pay/create';
  const btn=$('#pay'); btn.disabled=true; btn.textContent='Открываю оплату…';
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:leadEmail,landing:L,goal:answers.goal||'',quiz:answers,src:SRC})});
    const j=await r.json();
    if(j.url){ location.href=j.url; return; }
    if(j.already && j.plan_url){ location.href=j.plan_url; return; } // подписка уже есть
    if(r.status===422){ btn.disabled=false; btn.textContent='Оформить →';
      alert('Похоже, адрес почты не подошёл. Вернись на шаг назад и проверь email.'); return; }
    throw new Error(j.error||'no url');
  }catch(e){
    btn.disabled=false; btn.textContent='Оформить →';
    alert('Оплата временно недоступна. Попробуй ещё раз чуть позже.');
  }
}

const QS=new URLSearchParams(location.search);
// ?reset=1 — начать с чистого листа. Персист живёт сутки, поэтому во время
// проверок экран показывает ответы прошлого прохода, а не то, что видит новый
// человек. Ссылку убираем из адреса, чтобы обновление страницы не стирало
// ответы уже настоящего прохождения.
if(QS.get('reset')==='1'||QS.get('fresh')==='1'){
  clearState();
  try{ QS.delete('reset'); QS.delete('fresh');
    const q=QS.toString();
    history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash);
  }catch(e){}
}

// ?resume=TOKEN из лид-письма → подтянуть ответы и открыть СРАЗУ пейволл (не 11 шагов заново)
const RESUME=QS.get('resume');
if(RESUME){
  fetch('/api/lead/resume/'+encodeURIComponent(RESUME)).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.quiz){ Object.assign(answers,d.quiz); leadEmail=d.email||''; planRevealed=true;
      idx=STEPS.findIndex(s=>s.type==='plan'); if(idx<0) idx=STEPS.length-1; saveState(); }
    else loadState();
    render();
  }).catch(()=>{ loadState(); render(); });
} else { loadState(); render(); }
</script>
