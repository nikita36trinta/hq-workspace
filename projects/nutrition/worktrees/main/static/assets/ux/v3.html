<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вариант 3 · Плотный чек-лист</title>
<link rel="stylesheet" href="/assets/ux/_base.css">
<style>
  /* ВАРИАНТ 3. Плотный чек-лист.
     Ставка: приложением пользуются на бегу — на кухне, в магазине, стоя. Значит
     ценность не в красоте, а в скорости: весь день виден без прокрутки, любое
     действие — одно касание, фото в списке не нужны (они занимают место, а блюдо
     человек и так знает по названию).
     Это осознанный отказ от витрины в пользу инструмента. */
  body{padding-bottom:24px}
  .hd{position:sticky;top:41px;z-index:10;background:var(--bg);padding:12px 0 8px}
  .days{display:flex;gap:5px}
  .days button{flex:1;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;line-height:1}
  .days button i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
  .days button.done i{background:var(--g)}
  .days button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .days button.on i{background:rgba(255,255,255,.5)}

  .sum{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 2px}
  .sum .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .sum .bar i{display:block;height:100%;width:18%;background:var(--g)}
  .sum .n{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}

  .grp{margin-top:16px}
  .grp .gh{display:flex;align-items:center;gap:8px;padding:0 2px 7px}
  .grp .gh h2{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .grp .gh span{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .it{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);
    min-height:52px}
  .it:last-child{border-bottom:none}
  .cb{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:transparent;transition:.12s}
  .cb i{width:13px;height:13px}
  .it.on .cb{background:var(--g);border-color:var(--g);color:#fff}
  .it .tx{flex:1;min-width:0}
  .it .tx b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
  .it .tx span{font-size:11.5px;color:var(--muted)}
  .it.on .tx b{color:var(--muted);text-decoration:line-through}
  .it .rt{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;
    display:flex;align-items:center;gap:9px}
  .it .rec{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .it .rec i{width:14px;height:14px}
  .it .rec.open{background:var(--soft);border-color:var(--soft);color:var(--gd)}
  .rcp{display:none;padding:0 13px 13px 47px;font-size:13px;line-height:1.5;color:var(--muted);
    border-bottom:1px solid var(--line);background:var(--card)}
  .rcp.on{display:block}
  .rcp b{color:var(--ink);display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    margin:2px 0 5px}
  .rcp ol{margin:0 0 0 16px}

  /* вода и вес — теми же строками, а не отдельными карточками */
  .wcups{display:flex;gap:4px;margin-left:auto}
  .wcups span{width:13px;height:17px;border-radius:3px 3px 4px 4px;background:var(--line)}
  .wcups span.f{background:var(--wtr)}
  .bot{display:flex;gap:8px;margin-top:14px}
  .bot button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:12px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .bot button i{width:17px;height:17px;color:var(--muted)}
</style>
</head>
<body>
<div class="demoh"><a href="/assets/ux/">✕</a><b>Вариант 3 · Чек-лист</b><span>плотный, без фото</span></div>

<div class="wrap">
  <div class="hd">
    <div class="days" id="days"></div>
    <div class="sum"><span class="bar"><i></i></span><span class="n tnum">280 / 1580 ккал</span></div>
  </div>

  <div class="grp">
    <div class="gh"><h2>Еда</h2><span id="mdone">1 из 5</span></div>
    <div class="list" id="meals"></div>
  </div>

  <div class="grp">
    <div class="gh"><h2>Привычки</h2></div>
    <div class="list">
      <div class="it"><div class="cb"></div><div class="tx"><b>Вода</b><span>5 из 9 стаканов</span></div>
        <span class="wcups" id="cups"></span></div>
      <div class="it"><div class="cb"></div><div class="tx"><b>Вес</b><span>сегодня не записан</span></div>
        <div class="rt">70 кг</div></div>
    </div>
  </div>

  <div class="bot">
    <button><i id="b1"></i>Список покупок</button>
    <button><i id="b2"></i>Подписка</button>
  </div>
</div>

<script src="/assets/ux/_shared.js"></script>
<script>
  const put = (id, s) => { const e = document.getElementById(id); if (e) e.innerHTML = s; };
  put('b1', IC.cart); put('b2', IC.me);

  document.getElementById('days').innerHTML = Array.from({length: 7}, (_, i) =>
    `<button class="${i === 0 ? 'on' : ''}${i === 0 ? '' : ''}">${i + 1}<i></i></button>`).join('');

  document.getElementById('meals').innerHTML = NP.meals.map((m, i) => `
    <div class="it${m.done ? ' on' : ''}" data-i="${i}">
      <div class="cb">${IC.check}</div>
      <div class="tx"><b>${m.name}</b><span>${m.slot} · ${m.time} · Б${m.p} Ж${m.f} У${m.c}</span></div>
      <div class="rt"><span class="tnum">${m.kcal}</span>
        <button class="rec" data-r="${i}" aria-label="Рецепт">${IC.clock}</button></div>
    </div>
    <div class="rcp" id="r${i}">
      <b>Нужно</b>${m.ing.join(' · ')}
      <b>Как готовить</b><ol>${m.steps.map((s) => `<li>${s}</li>`).join('')}</ol>
    </div>`).join('');

  document.getElementById('cups').innerHTML =
    Array.from({length: NP.water.goal}, (_, i) => `<span class="${i < NP.water.done ? 'f' : ''}"></span>`).join('');

  document.querySelectorAll('.it .cb').forEach((cb) => cb.addEventListener('click', () => {
    cb.closest('.it').classList.toggle('on');
    const n = document.querySelectorAll('#meals .it.on').length;
    document.getElementById('mdone').textContent = `${n} из ${NP.meals.length}`;
  }));
  document.querySelectorAll('.rec').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = document.getElementById('r' + b.dataset.r);
    r.classList.toggle('on'); b.classList.toggle('open');
  }));
  document.querySelectorAll('#days button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('#days button').forEach((x) => x.classList.toggle('on', x === b));
  }));
</script>
</body>
</html>
